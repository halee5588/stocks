name: Auto Update Market Data

on:
  schedule:
    # Runs Monday through Friday at 14:30 UTC (4:30 AM HST / 10:30 AM EDT) and 21:00 UTC (post-market close)
    - cron: '30 14,21 * * 1-5'
  workflow_dispatch: # Allows manual click of "Run workflow" in GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run data fetch & update index.html
        run: python app.py --export

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-refresh market data [skip ci]" && git push)
